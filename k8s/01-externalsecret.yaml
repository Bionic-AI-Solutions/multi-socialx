# Syncs secret/t6-apps/socialx/config → K8s Secret socialx-secrets.
# The app also loads this Vault path at runtime via VAULT_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: socialx-secrets
  namespace: socialx
  labels:
    app.kubernetes.io/name: socialx
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: socialx-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        VAULT_TOKEN: "{{ .vault_token }}"
        DATABASE_URL: "{{ .database_url }}"
        REDIS_URL: "{{ .redis_url }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        MAIN_URL: "{{ .main_url }}"
        FRONTEND_URL: "{{ .frontend_url }}"
        NEXT_PUBLIC_BACKEND_URL: "{{ .next_public_backend_url }}"
        BACKEND_INTERNAL_URL: "{{ .backend_internal_url }}"
        STORAGE_PROVIDER: "{{ .storage_provider }}"
        UPLOAD_DIRECTORY: "{{ .upload_directory }}"
        NEXT_PUBLIC_UPLOAD_DIRECTORY: "{{ .next_public_upload_directory }}"
        IS_GENERAL: "{{ .is_general }}"
        TEMPORAL_ADDRESS: "{{ .temporal_address }}"
        TEMPORAL_NAMESPACE: "{{ .temporal_namespace }}"
        DISABLE_REGISTRATION: "{{ .disable_registration }}"
        NX_ADD_PLUGINS: "false"
        API_LIMIT: "{{ .api_limit }}"
        FEE_AMOUNT: "{{ .fee_amount }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        YOUTUBE_CLIENT_ID: "{{ .youtube_client_id }}"
        YOUTUBE_CLIENT_SECRET: "{{ .youtube_client_secret }}"
        X_API_KEY: "{{ .x_api_key }}"
        X_API_SECRET: "{{ .x_api_secret }}"
        LINKEDIN_CLIENT_ID: "{{ .linkedin_client_id }}"
        LINKEDIN_CLIENT_SECRET: "{{ .linkedin_client_secret }}"
        FACEBOOK_APP_ID: "{{ .facebook_app_id }}"
        FACEBOOK_APP_SECRET: "{{ .facebook_app_secret }}"
        THREADS_APP_ID: "{{ .threads_app_id }}"
        THREADS_APP_SECRET: "{{ .threads_app_secret }}"
        TIKTOK_CLIENT_ID: "{{ .tiktok_client_id }}"
        TIKTOK_CLIENT_SECRET: "{{ .tiktok_client_secret }}"
        GOOGLE_GMB_CLIENT_ID: "{{ .google_gmb_client_id }}"
        GOOGLE_GMB_CLIENT_SECRET: "{{ .google_gmb_client_secret }}"
        PINTEREST_CLIENT_ID: "{{ .pinterest_client_id }}"
        PINTEREST_CLIENT_SECRET: "{{ .pinterest_client_secret }}"
        REDDIT_CLIENT_ID: "{{ .reddit_client_id }}"
        REDDIT_CLIENT_SECRET: "{{ .reddit_client_secret }}"
  data:
    - secretKey: vault_token
      remoteRef:
        key: t6-apps/socialx/config
        property: vault_token
    - secretKey: database_url
      remoteRef:
        key: t6-apps/socialx/config
        property: database_url
    - secretKey: redis_url
      remoteRef:
        key: t6-apps/socialx/config
        property: redis_url
    - secretKey: jwt_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: jwt_secret
    - secretKey: main_url
      remoteRef:
        key: t6-apps/socialx/config
        property: main_url
    - secretKey: frontend_url
      remoteRef:
        key: t6-apps/socialx/config
        property: frontend_url
    - secretKey: next_public_backend_url
      remoteRef:
        key: t6-apps/socialx/config
        property: next_public_backend_url
    - secretKey: backend_internal_url
      remoteRef:
        key: t6-apps/socialx/config
        property: backend_internal_url
    - secretKey: storage_provider
      remoteRef:
        key: t6-apps/socialx/config
        property: storage_provider
    - secretKey: upload_directory
      remoteRef:
        key: t6-apps/socialx/config
        property: upload_directory
    - secretKey: next_public_upload_directory
      remoteRef:
        key: t6-apps/socialx/config
        property: next_public_upload_directory
    - secretKey: is_general
      remoteRef:
        key: t6-apps/socialx/config
        property: is_general
    - secretKey: temporal_address
      remoteRef:
        key: t6-apps/socialx/config
        property: temporal_address
    - secretKey: temporal_namespace
      remoteRef:
        key: t6-apps/socialx/config
        property: temporal_namespace
    - secretKey: disable_registration
      remoteRef:
        key: t6-apps/socialx/config
        property: disable_registration
    - secretKey: api_limit
      remoteRef:
        key: t6-apps/socialx/config
        property: api_limit
    - secretKey: fee_amount
      remoteRef:
        key: t6-apps/socialx/config
        property: fee_amount
    - secretKey: openai_api_key
      remoteRef:
        key: t6-apps/socialx/config
        property: openai_api_key
    - secretKey: youtube_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: youtube_client_id
    - secretKey: youtube_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: youtube_client_secret
    - secretKey: x_api_key
      remoteRef:
        key: t6-apps/socialx/config
        property: x_api_key
    - secretKey: x_api_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: x_api_secret
    - secretKey: linkedin_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: linkedin_client_id
    - secretKey: linkedin_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: linkedin_client_secret
    - secretKey: facebook_app_id
      remoteRef:
        key: t6-apps/socialx/config
        property: facebook_app_id
    - secretKey: facebook_app_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: facebook_app_secret
    - secretKey: threads_app_id
      remoteRef:
        key: t6-apps/socialx/config
        property: threads_app_id
    - secretKey: threads_app_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: threads_app_secret
    - secretKey: tiktok_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: tiktok_client_id
    - secretKey: tiktok_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: tiktok_client_secret
    - secretKey: google_gmb_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: google_gmb_client_id
    - secretKey: google_gmb_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: google_gmb_client_secret
    - secretKey: pinterest_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: pinterest_client_id
    - secretKey: pinterest_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: pinterest_client_secret
    - secretKey: reddit_client_id
      remoteRef:
        key: t6-apps/socialx/config
        property: reddit_client_id
    - secretKey: reddit_client_secret
      remoteRef:
        key: t6-apps/socialx/config
        property: reddit_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-pull-secret
  namespace: socialx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: dockerhub-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .pat }}","email":"{{ .email }}","auth":"{{ printf "%s:%s" .username .pat | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: shared/dockerhub
        property: username
    - secretKey: pat
      remoteRef:
        key: shared/dockerhub
        property: pat
    - secretKey: email
      remoteRef:
        key: shared/dockerhub
        property: email
