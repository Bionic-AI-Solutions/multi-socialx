apiVersion: v1
kind: ConfigMap
metadata:
  name: socialx-config
  namespace: socialx
  labels:
    app.kubernetes.io/name: socialx
data:
  # Matches .env key VAULT_HOST (VAULT_ADDR is also accepted by the loader)
  VAULT_HOST: "http://vault.vault.svc.cluster.local:8200"
  VAULT_APP_SLUG: "socialx"
  # Non-secret runtime knobs (secrets come from Vault / ExternalSecret)
  STORAGE_PROVIDER: "local"
  UPLOAD_DIRECTORY: "/uploads"
  NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
  IS_GENERAL: "true"
  NX_ADD_PLUGINS: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamicconfig
  namespace: socialx
  labels:
    app.kubernetes.io/name: socialx
    app.kubernetes.io/component: temporal
data:
  development-sql.yaml: |
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
