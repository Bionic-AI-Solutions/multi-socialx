apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialx-redis
  namespace: socialx
  labels:
    app: socialx-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socialx-redis
  template:
    metadata:
      labels:
        app: socialx-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: socialx-redis
  namespace: socialx
  labels:
    app: socialx-redis
spec:
  selector:
    app: socialx-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
